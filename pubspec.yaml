name: leep
description: Finanzas personales para Peru. Lee los correos de tu banco y arma tu presupuesto solo.
publish_to: "none"
version: 1.0.0+1

environment:
  # withValues, CardThemeData y los Notifier de Riverpod 2.5 piden Flutter
  # 3.27 o mas nuevo.
  flutter: ">=3.27.0"
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Base de datos local (sin codegen: SQL a mano, nada de build_runner)
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Gmail
  google_sign_in: ^6.2.2
  http: ^1.2.2

  # Utilidades
  intl: ^0.20.3
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # La rana de Leep. Es una silueta con alfa: se pinta con el color que
    # toque en cada tema, no trae color propio.
    - assets/marca/

  fonts:
    # Empaquetadas a proposito. La app funciona sin internet, asi que no puede
    # depender de que Google Fonts responda para dibujar un monto.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
